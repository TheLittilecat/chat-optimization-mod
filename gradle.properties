# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.5
# 用 1.17-SNAPSHOT：1.18-SNAPSHOT 要求 Gradle 9.7+，而本工程 wrapper 停在 9.5.1，
# 强行升 loom 会报 plugin api-version 9.7.0 vs 9.5.1 不匹配。
# 老版本 fabric-api 的 access widener 命名空间问题改用 build.gradle 里的
# mappings loom.officialMojangMappings() 解决，不依赖 loom 版本。
loom_version=1.17-SNAPSHOT

# Mod Properties
version=1.0.0
group=com.example

# Dependencies
fabric_api_version=0.158.0+26.2

# AutoForge: mod_id 台账。loom 不消费这个键(fabric 的 modid 在 fabric.mod.json 里),
# 它只供 modify/resume 流程把原 MOD_ID 读回来,避免每轮被迫做整体包名迁移。请勿删改。
mod_id=minecraft-chat-optimization-mod
